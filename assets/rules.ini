; One section per site. If a site changes its page, edit only this file.
;
; match    regex tested against the url you give the program
; element  text that identifies the HTML tag holding the link
; attr     attributes to read from that tag, in order
;          add :base64 if the value is base64-encoded
; render   auto    = plain download, then the built-in browser if the link is not found
;          http    = plain download only
;          browser = always use the built-in browser

[mediafire]
match = ^https?://(www\.)?mediafire\.com/(file|file_premium|download)/
element = id="downloadButton"
attr = data-scrambled-url:base64, href
render = auto
